schema_version = "1.4"

artifacts = [
  { source = "/workspace", exclude = ["node_modules", ".git", ".next", "dist", "coverage"] },
]

[task]
name = "assistant-ui/g10-chatgpt-shell"
version = "0.1.0"
authors = []
keywords = ["assistant-ui", "harbor", "g10", "chatgpt", "model-selector"]
description = "G10: ChatGPT-like shell with conversation sidebar and model selector. Gold uses -t default -p chatgpt plus model-selector and stub chat."

[metadata]
category = "app-building"
workstream = "assistant-ui-agent-evals"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
JUDGE_MODEL = "gpt-5.6-luna"
PB1_MCP = "on"

[environment]
network_mode = "public"
build_timeout_sec = 7200.0
memory_mb = 8192
storage_mb = 10240
workdir = "/workspace"
cpus = 2

[environment.env]
PB1_MCP = "on"

[[environment.mcp_servers]]
name = "assistant-ui"
transport = "stdio"
command = "bash"
args = [
  "-lc",
  "case ${PB1_MCP:-on} in off|0|false|no|disabled) exec true;; *) exec assistant-ui-mcp;; esac",
]
